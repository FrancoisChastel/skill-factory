<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Factory</title>
<style>
  :root {
    --bg: oklch(97% 0.008 260);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96% 0.01 260);
    --border: oklch(89% 0.012 260);
    --text: oklch(22% 0.02 265);
    --muted: oklch(52% 0.02 265);
    --accent: oklch(58% 0.19 265);
    --accent-soft: oklch(94% 0.05 265);
    --good: oklch(62% 0.16 150);
    --bad: oklch(60% 0.2 25);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 14px;
    --shadow: 0 1px 2px oklch(20% 0.02 265 / 0.06), 0 8px 24px oklch(20% 0.02 265 / 0.06);
    --space: clamp(1rem, 0.6rem + 1.5vw, 1.6rem);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(17% 0.02 265);
      --surface: oklch(21% 0.02 265);
      --surface-2: oklch(25% 0.02 265);
      --border: oklch(31% 0.02 265);
      --text: oklch(94% 0.01 265);
      --muted: oklch(68% 0.02 265);
      --accent: oklch(72% 0.16 265);
      --accent-soft: oklch(30% 0.06 265);
      --good: oklch(72% 0.16 150);
      --bad: oklch(70% 0.18 25);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.4), 0 10px 30px oklch(0% 0 0 / 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(17% 0.02 265); --surface: oklch(21% 0.02 265); --surface-2: oklch(25% 0.02 265);
    --border: oklch(31% 0.02 265); --text: oklch(94% 0.01 265); --muted: oklch(68% 0.02 265);
    --accent: oklch(72% 0.16 265); --accent-soft: oklch(30% 0.06 265);
    --good: oklch(72% 0.16 150); --bad: oklch(70% 0.18 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.4), 0 10px 30px oklch(0% 0 0 / 0.35);
  }
  :root[data-theme="light"] {
    --bg: oklch(97% 0.008 260); --surface: oklch(100% 0 0); --surface-2: oklch(96% 0.01 260);
    --border: oklch(89% 0.012 260); --text: oklch(22% 0.02 265); --muted: oklch(52% 0.02 265);
    --accent: oklch(58% 0.19 265); --accent-soft: oklch(94% 0.05 265);
    --good: oklch(62% 0.16 150); --bad: oklch(60% 0.2 25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--sans); color: var(--text); background: var(--bg);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    flex-wrap: wrap; padding: var(--space) var(--space) 0;
    max-width: 1180px; margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 0.6rem; }
  .brand h1 {
    font-size: clamp(1.5rem, 1rem + 2vw, 2.4rem); margin: 0; letter-spacing: -0.03em; font-weight: 680;
  }
  .brand .dot { color: var(--accent); }
  .brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .controls { display: flex; gap: 0.5rem; align-items: center; }
  button, input[type=text] {
    font: inherit; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 0.5rem 0.8rem;
  }
  button { cursor: pointer; transition: transform var(--dur, 150ms) ease, background 150ms ease, border-color 150ms; }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: oklch(100% 0 0); border-color: transparent; font-weight: 600; }
  main {
    display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: var(--space);
    max-width: 1180px; margin: 0 auto; padding: var(--space);
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
    margin: 0; padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); }
  .runlist { list-style: none; margin: 0; padding: 0.4rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .runlist li { border-radius: 10px; padding: 0.7rem 0.8rem; cursor: pointer; border: 1px solid transparent;
    transition: background 150ms ease, border-color 150ms ease; }
  .runlist li:hover { background: var(--surface-2); }
  .runlist li[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .runlist .name { font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
  .runlist .meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
  .badge { font-family: var(--mono); font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .delta { font-family: var(--mono); font-weight: 600; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }

  .detail { padding: 1.2rem; }
  .empty { color: var(--muted); text-align: center; padding: 4rem 1rem; }
  .scorerow { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; }
  .stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: 1.7rem; font-weight: 640; letter-spacing: -0.02em; margin-top: 0.2rem; }
  .chart { width: 100%; height: 160px; margin: 0.5rem 0 1.4rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  td.num { font-family: var(--mono); text-align: right; }
  .accepted { color: var(--good); font-weight: 600; }
  .rejected { color: var(--muted); }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.4rem; }
  @media (max-width: 700px) { .diff { grid-template-columns: 1fr; } }
  .diff h3 { font-size: 0.8rem; margin: 0 0 0.4rem; color: var(--muted); }
  pre.body { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.8rem; overflow: auto; max-height: 420px; font-family: var(--mono); font-size: 0.78rem; white-space: pre-wrap; }
  .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 0.6rem 1rem; border-radius: 10px; box-shadow: var(--shadow);
    opacity: 0; transition: opacity 200ms ease; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Skill Factory<span class="dot">.</span></h1>
      <p>scientific skill optimization — runs dashboard</p>
    </div>
    <div class="controls">
      <input id="config" type="text" placeholder="path/to/config.yaml" size="26" />
      <button class="primary" id="run">Optimize</button>
      <button id="refresh" title="Refresh runs">↻</button>
      <button id="theme" title="Toggle theme">◑</button>
    </div>
  </header>
  <main>
    <aside class="panel" aria-label="Runs">
      <h2>Runs</h2>
      <ul class="runlist" id="runs"></ul>
    </aside>
    <section class="panel" aria-label="Run detail">
      <h2>Detail</h2>
      <div class="detail" id="detail"><p class="empty">Select a run, or start one above.</p></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
let selected = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
function fmt(x) { return (x === null || x === undefined) ? "–" : Number(x).toFixed(3); }
function deltaClass(x) { return x > 0.0005 ? "up" : x < -0.0005 ? "down" : "flat"; }
function deltaStr(x) { const p = (x * 100); return (p >= 0 ? "+" : "") + p.toFixed(1) + " pts"; }
function esc(s) { return (s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadRuns() {
  const res = await fetch("/api/runs");
  const { runs } = await res.json();
  const ul = $("#runs");
  ul.innerHTML = "";
  if (!runs.length) { ul.innerHTML = '<li class="empty" style="cursor:default">No runs yet.</li>'; return; }
  for (const r of runs) {
    const li = document.createElement("li");
    const imp = r.improvement ?? 0;
    li.setAttribute("data-dir", r.dir);
    li.setAttribute("role", "button");
    li.innerHTML = `
      <div class="name">${esc(r.name)}</div>
      <div class="meta">
        <span class="badge">${esc(r.optimizer ?? "?")}</span>
        <span class="delta ${deltaClass(imp)}">${deltaStr(imp)}</span>
        <span>${fmt(r.baseline_score)} → ${fmt(r.best_score)}</span>
      </div>`;
    li.addEventListener("click", () => selectRun(r.dir, li));
    ul.appendChild(li);
  }
}

async function selectRun(dir, li) {
  document.querySelectorAll(".runlist li").forEach(x => x.setAttribute("aria-selected", "false"));
  if (li) li.setAttribute("aria-selected", "true");
  selected = dir;
  const res = await fetch("/api/run?dir=" + encodeURIComponent(relDir(dir)));
  if (!res.ok) { toast("Could not load run"); return; }
  renderDetail(await res.json());
}

function relDir(dir) {
  // The server resolves dir relative to the runs root; send the basename chain after it.
  return dir;
}

function sparkline(history) {
  const w = 600, h = 150, pad = 24;
  const vals = history.map(c => c.val_score);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const x = i => pad + (i * (w - 2 * pad)) / Math.max(1, history.length - 1);
  const y = v => h - pad - ((v - min) / span) * (h - 2 * pad);
  let path = "", dots = "";
  history.forEach((c, i) => {
    path += (i === 0 ? "M" : "L") + x(i).toFixed(1) + " " + y(c.val_score).toFixed(1) + " ";
    const col = c.accepted ? "var(--good)" : "var(--muted)";
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(c.val_score).toFixed(1)}" r="4" fill="${col}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="validation score by candidate">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function renderDetail(run) {
  const imp = run.improvement ?? 0;
  const rows = (run.history || []).map(c => `
    <tr>
      <td class="num">${c.iteration}</td>
      <td class="num">${fmt(c.train_score)}</td>
      <td class="num">${fmt(c.val_score)}</td>
      <td class="${c.accepted ? "accepted" : "rejected"}">${c.accepted ? "accepted" : "rejected"}</td>
      <td>${esc(c.note)}</td>
    </tr>`).join("");
  const seed = (run.history && run.history[0]) ? run.history[0].body : "";
  const best = run.best_skill ? run.best_skill.body : "";
  $("#detail").innerHTML = `
    <div class="scorerow">
      <div class="stat"><div class="k">Optimizer</div><div class="v" style="font-size:1.1rem">${esc(run.optimizer)}</div></div>
      <div class="stat"><div class="k">Baseline</div><div class="v">${fmt(run.baseline_score)}</div></div>
      <div class="stat"><div class="k">Best</div><div class="v">${fmt(run.best_score)}</div></div>
      <div class="stat"><div class="k">Improvement</div><div class="v delta ${deltaClass(imp)}">${deltaStr(imp)}</div></div>
    </div>
    ${sparkline(run.history || [])}
    <table>
      <thead><tr><th>iter</th><th>train</th><th>val</th><th>gate</th><th>note</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="diff">
      <div><h3>Seed skill</h3><pre class="body">${esc(seed)}</pre></div>
      <div><h3>Best skill</h3><pre class="body">${esc(best)}</pre></div>
    </div>`;
}

$("#refresh").addEventListener("click", loadRuns);
$("#run").addEventListener("click", async () => {
  const config = $("#config").value.trim();
  if (!config) { toast("Enter a config path"); return; }
  const btn = $("#run"); btn.disabled = true; btn.textContent = "Running…";
  try {
    const res = await fetch("/api/optimize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ config }),
    });
    const data = await res.json();
    if (data.ok) { toast("Done: " + deltaStr(data.improvement)); await loadRuns(); }
    else { toast("Failed: " + (data.error || "unknown")); }
  } catch (e) { toast("Request failed"); }
  finally { btn.disabled = false; btn.textContent = "Optimize"; }
});
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  root.setAttribute("data-theme", next);
});

loadRuns();
</script>
</body>
</html>
