<title id="t">jev: 29% to 84% of malicious skills caught</title>
<desc id="d">Recall against false-flag rate on validation. The released judge catches 29.0% at 1.28% false flags; the hand-shipped probe set 79.6% at 0.64%; a greedy union 87.1% at 1.50%, refused by the gate; skill-factory optimize 83.9% at 0.43%.</desc>
