# Local, zero-cost run against an LM Studio server (OpenAI-compatible).
# Verified live: baseline 0.151 -> 1.000 with gemma-4-31b-it-mlx.
#   skill-factory optimize -c examples/ticket-classifier/config.lmstudio.yaml

skill: seed_skill.md
dataset: dataset.jsonl
val_fraction: 0.34
seed: 3

provider:            {name: lmstudio, model: gemma-4-31b-it-mlx}
optimizer_provider:  {name: lmstudio, model: gemma-4-31b-it-mlx}
judge_provider:      {name: lmstudio, model: gemma-4-31b-it-mlx}

optimizer:
  name: llm_loop
  rounds: 4
  minibatch_size: 3
  max_edits_per_round: 1
  patience: 2
  goal: >
    Make the skill output EXACTLY ONE lowercase category label and nothing else,
    from: billing, bug, feature_request, account, other. No punctuation, no
    explanation, no quotes. Teach category boundaries (login/2FA/email = account;
    charges/invoices/plan limits = billing).

metric:
  golden:
    mode: normalized
    weight: 2.0
  programmatic:
    weight: 1.0
    checks:
      - {matches_regex: "(?i)^\\s*(billing|bug|feature_request|account|other)\\s*$"}
  judge:
    weight: 1.0
    criteria:
      - {name: correctness, description: "Is the chosen category the best fit?", weight: 3}
      - {name: format, description: "A single bare label with no extra text?", weight: 2}

harness:
  temperature: 0.0
  max_tokens: 32
  max_workers: 1

output:
  dir: runs/ticket-local
  emit_skill_dir: dist-local
