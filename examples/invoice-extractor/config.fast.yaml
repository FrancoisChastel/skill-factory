# Lightweight config for a quick LIVE demo run (fewer rounds, weaker target model
# so there is headroom to improve, parallel rollouts). ~50 API calls.
#   set -a; source .env; set +a
#   skill-factory optimize -c examples/invoice-extractor/config.fast.yaml

skill: seed_skill.md
dataset: dataset.jsonl
val_fraction: 0.34
seed: 7

provider:                       # target that RUNS the skill (weaker => more to gain)
  name: anthropic
  model: claude-haiku-4-5-20251001

optimizer_provider:             # proposes skill edits
  name: anthropic
  model: claude-sonnet-5

judge_provider:
  name: anthropic
  model: claude-sonnet-5

optimizer:
  name: llm_loop
  rounds: 3
  minibatch_size: 3
  max_edits_per_round: 1
  patience: 2
  goal: >
    Make the skill reliably output ONLY a JSON object with keys
    vendor, date (ISO 8601 YYYY-MM-DD), total (number), and currency (ISO 4217),
    correctly normalizing localized dates, decimal separators, and currency symbols.

metric:
  golden:
    mode: json_equal
    weight: 2.0
  programmatic:
    weight: 1.0
    checks:
      - is_valid_json
      - {json_has_keys: [vendor, date, total, currency]}
  judge:
    weight: 1.0
    criteria:
      - name: correctness
        description: Are vendor, date, total, currency all correct and normalized?
        weight: 3
      - name: format
        description: Is the output strictly one JSON object, no prose or code fences?
        weight: 2

harness:
  temperature: 0.0
  max_tokens: 1024
  max_workers: 4

output:
  dir: runs/invoice-extractor-fast
  emit_skill_dir: dist
