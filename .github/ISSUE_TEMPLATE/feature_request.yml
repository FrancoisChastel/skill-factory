name: Feature request
description: Suggest a new optimizer, provider, metric, or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point behind the request.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Optimizer backend
        - Provider / model
        - Metric
        - Harness
        - CLI / UI
        - Export / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working (API sketch welcome).
