name: Release

# Publishes to PyPI when a GitHub release is published (drafts don't trigger).
#
# One-time setup (no token needed in the repo): on pypi.org, add a "trusted
# publisher" for project `skill-factory` pointing at this repository, workflow
# `release.yml`, environment `pypi`.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Build sdist and wheel
        run: python -m build --outdir pkg-dist

      - name: Check metadata
        run: twine check pkg-dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: pkg-dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: pkg-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg-dist/
